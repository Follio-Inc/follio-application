name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build:ci
        env:
          # Skip env validation during build for CI
          SKIP_ENV_VALIDATION: true
          # Provide dummy values for required env vars during build
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          # Use placeholder values for Clerk (app uses force-dynamic so these won't cause issues)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_placeholder'
          CLERK_SECRET_KEY: 'sk_test_placeholder'
          # Skip Clerk JWKS validation during build
          CLERK_SKIP_JWT_VERIFICATION_IN_DEVELOPMENT: 'true'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  drift:
    name: Developer Platform Drift
    runs-on: ubuntu-latest
    # Blocking, per PLATFORM_TODO item 30, which supersedes item 9's
    # warning-only job. There is deliberately no `continue-on-error` here, at
    # either level: this job gates the build, and a setup failure fails it like
    # any other job's would.
    #
    # What counts as blocking is decided by the scanner, not by this file.
    # `--strict` makes the CLI exit 1 when `DriftReport.ok` is false, and `ok`
    # is false only for the contradiction findings — the coverage map
    # disagreeing with the repository. Recorded gaps (an unclaimed model, a
    # feature with no pathway, a category with no lab) and category health
    # leave `ok` true and this job green. Nothing here widens that definition
    # to make CI stricter, and nothing here reads the report text to reach a
    # verdict: the exit code is the verdict.
    #
    # A non-zero exit therefore means one of two things — the scan found a
    # contradiction, or the scan failed to run. Both fail the build, which is
    # the point of the item; the report in the log and in the step summary says
    # which it was, and this file does not guess on its behalf.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No `prisma generate` step: the scanner's whole import closure is
      # node:fs, node:path and typescript, so it needs no generated client.
      # Leaving it out keeps a Prisma problem from looking like drift.
      - name: Run Developer Platform drift scan
        id: scan
        run: |
          set -o pipefail
          npm run platform:scan -- --strict 2>&1 | tee "$RUNNER_TEMP/drift-report.txt"

      # Separate, and `always()`, so the report reaches the summary whether the
      # scan passed, found drift or failed outright. The wording comes from
      # `steps.scan.outcome`, which is GitHub's own record of the exit code —
      # not a reading of the report.
      - name: Publish the drift report
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          REPORT="$RUNNER_TEMP/drift-report.txt"
          {
            echo "## Developer Platform drift scan"
            echo
            if [ "$SCAN_OUTCOME" = 'success' ]; then
              echo "**No drift found** — the coverage map matches the repository. Recorded gaps and category health are reported above without failing this job."
            elif [ "$SCAN_OUTCOME" = 'skipped' ]; then
              echo "**The scan did not run** — an earlier step in this job failed."
            else
              echo "**This build is blocked by the drift scan.** Either the coverage map contradicts the repository or the scan failed to run; the report below says which. Blocking per PLATFORM_TODO item 30 — fix the contradiction, or record the change in the coverage map."
            fi
            echo
            if [ -s "$REPORT" ]; then
              echo "<details><summary>Full report</summary>"
              echo
              echo '```text'
              cat "$REPORT"
              echo '```'
              echo
              echo "</details>"
            else
              echo "_The scan produced no output._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCAN_OUTCOME" != 'success' ]; then
            echo "::error title=Developer Platform drift scan::$SCAN_OUTCOME — see the job summary. Either the coverage map contradicts the repository or the scan failed to run. This blocks the build."
          fi
