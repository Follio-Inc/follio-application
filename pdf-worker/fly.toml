# Warm Chromium PDF worker — keep at least one machine running.
# fly apps create follio-pdf
# fly secrets set PDF_WORKER_SECRET=...
# fly deploy

app = 'follio-pdf'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
