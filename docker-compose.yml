# Docker Compose for Follio Local Development
#
# Runs the DATABASE only. The Next.js app runs on the host with `npm run dev`.
#
#   docker compose up -d        start Postgres in the background
#   docker compose ps           see status + health
#   docker compose stop         stop containers, keep the data
#   docker compose down         remove containers, keep the data (named volume)
#
# The host port comes from POSTGRES_PORT in .env (Compose reads that file
# automatically). It defaults to 5432, so teammates without a POSTGRES_PORT
# entry get the documented behaviour unchanged.

services:
  postgres:
    image: postgres:16-alpine
    container_name: follio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: follio
    ports:
      # "<host port>:<container port>" — inside Docker it is always 5432.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Named volume: the data lives inside Docker, NOT in this repo folder,
      # and survives `docker compose down`.
      - follio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d follio so "healthy" means the follio database itself is ready
      # to accept queries, not merely that the server process booted.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d follio']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching and rate limiting.
  # No application code imports Redis yet, so it is behind a profile and does
  # not start by default. Start it with: docker compose --profile redis up -d
  redis:
    profiles: ['redis']
    image: redis:7-alpine
    container_name: follio-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - follio_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pdf-worker:
    profiles: ['pdf']
    build: ./pdf-worker
    container_name: follio-pdf-worker
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      PDF_WORKER_SECRET: local-pdf-worker-secret

volumes:
  follio_postgres_data:
  follio_redis_data:
