# Docker Compose for Follio Local Development
# Run: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: follio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: follio
    ports:
      - '5432:5432'
    volumes:
      - follio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: follio-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - follio_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pdf-worker:
    profiles: ['pdf']
    build: ./pdf-worker
    container_name: follio-pdf-worker
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      PDF_WORKER_SECRET: local-pdf-worker-secret

volumes:
  follio_postgres_data:
  follio_redis_data:
