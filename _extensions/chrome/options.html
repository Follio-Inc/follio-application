<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Follio extension settings</title>
    <style>
      body {
        font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        margin: 16px;
        color: #14212b;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #d5d0c7;
        border-radius: 8px;
        font: inherit;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: #0b6e4f;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .hint {
        font-size: 12px;
        color: #5c6b76;
        margin-top: 8px;
        line-height: 1.4;
      }
      #saved {
        font-size: 12px;
        color: #0b6e4f;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <label for="apiBase">Follio API base URL</label>
    <input id="apiBase" type="url" placeholder="http://localhost:3000" />
    <p class="hint">
      Use <code>http://localhost:3000</code> while developing. Use
      <code>https://follio.me</code> (or your deployed app URL) for production. Stay signed in to
      Follio in this browser.
    </p>
    <button type="button" id="save">Save</button>
    <div id="saved"></div>
    <script src="options.js" type="module"></script>
  </body>
</html>
